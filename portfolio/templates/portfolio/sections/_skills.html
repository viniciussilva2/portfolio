<section id="habilidades" class="section" data-section>
  <header class="head" data-reveal>
    <span class="head__kicker" aria-hidden="true"></span>
    <h2 class="head__title">{{ ui.title_skills }}</h2>
  </header>
  <ul class="skills">
    {% for group in content.skill_groups %}
    <li data-reveal>
      <div class="skill-card card" data-glow>
        <div class="skill-card__head">
          <h3 class="skill-card__name">{{ group.name }}</h3>
          <span class="skill-card__count" aria-hidden="true">{{ group.skills|length|stringformat:"02d" }}</span>
        </div>
        <ul class="tokens">
          {% for skill in group.skills %}<li class="token">{{ skill }}</li>{% endfor %}
        </ul>
      </div>
    </li>
    {% endfor %}
  </ul>
</section>
