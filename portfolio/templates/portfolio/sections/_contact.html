{% with links=profile.links %}
<section id="contato" class="block" data-stop data-section>
  <div class="block__head">
    <span class="node" aria-hidden="true"></span>
    <h2 class="block__title" data-decode>{{ ui.title_contact }}</h2>
  </div>
  <div class="contact" data-part>
    <p class="contact__lead">{{ ui.contact_lead }}</p>
    <ul class="channels">
      <li><a href="{{ links.linkedin }}" target="_blank" rel="noopener">LinkedIn</a></li>
      <li><a href="{{ links.github }}" target="_blank" rel="noopener">GitHub</a></li>
      {% if links.email %}<li><a href="mailto:{{ links.email }}">{{ links.email }}</a></li>{% endif %}
      {% if links.whatsapp %}<li><a href="https://wa.me/{{ links.whatsapp }}" target="_blank" rel="noopener">WhatsApp</a></li>{% endif %}
    </ul>
  </div>
</section>
{% endwith %}
