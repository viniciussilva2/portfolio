{% with links=profile.links %}
<section id="contato" class="section contact" data-section>
  <div class="contact__inner">
    <p class="contact__badge" data-reveal>{{ ui.title_contact }}</p>
    <h2 class="contact__title" data-reveal>{{ ui.contact_title }}</h2>
    <p class="contact__lead" data-reveal>{{ ui.contact_lead }}</p>
    <div data-reveal>
      <ul class="channels">
        {% if links.email %}
        <li>
          <a class="button button--primary button--case" href="mailto:{{ links.email }}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            {{ links.email }}
          </a>
        </li>
        {% endif %}
        <li>
          <a class="button" href="{{ links.linkedin }}" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path class="icon-fill" d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>
            LinkedIn
          </a>
        </li>
        <li>
          <a class="button" href="{{ links.github }}" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path class="icon-fill" d="M12 .3a12 12 0 0 0-3.8 23.38c.6.12.83-.26.83-.57L9 21.07c-3.34.72-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.08-.74.09-.73.09-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.8 1.3 3.49 1 .1-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.14-.3-.54-1.52.1-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.28-1.55 3.29-1.23 3.29-1.23.64 1.66.24 2.88.12 3.18a4.65 4.65 0 0 1 1.23 3.22c0 4.61-2.8 5.63-5.48 5.92.42.36.81 1.1.81 2.22l-.01 3.29c0 .31.2.69.82.57A12 12 0 0 0 12 .3"/></svg>
            GitHub
          </a>
        </li>
        {% if links.whatsapp %}
        <li>
          <a class="button" href="https://wa.me/{{ links.whatsapp }}" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z"/></svg>
            WhatsApp
          </a>
        </li>
        {% endif %}
      </ul>
    </div>
  </div>
</section>
{% endwith %}
