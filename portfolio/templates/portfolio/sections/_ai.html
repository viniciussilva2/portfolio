{% if content.ai %}
<section id="ia" class="section" data-section>
  <header class="head head--center" data-reveal>
    <span class="head__kicker" aria-hidden="true"></span>
    <h2 class="head__title">{{ ui.title_ai }}</h2>
    <p class="head__lead">{{ content.ai.summary }}</p>
  </header>
  <ul class="tools">
    {% for tool in content.ai.tools %}
    <li data-reveal>
      <article class="tool card" data-glow>
        {% if tool.logo %}<div class="tool__scene">{% include "portfolio/_logo.html" with item=tool %}</div>{% endif %}
        <div class="tool__info">
          <span class="tool__num" aria-hidden="true">{{ forloop.counter }}</span>
          <div>
            <h3 class="tool__name">{{ tool.name }}</h3>
            <p class="tool__use">{{ tool.use }}</p>
          </div>
        </div>
      </article>
    </li>
    {% endfor %}
  </ul>
</section>
{% endif %}
