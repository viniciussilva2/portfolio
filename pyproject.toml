[project]
name = "portfolio"
version = "0.1.0"
description = "Portfólio profissional de Vinicius Silva"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.2",
    "pyyaml>=6.0.3",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
