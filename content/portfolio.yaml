# e espanhol foram traduzidas por mim a partir do português: vale revisar.

profile:
  name: Vinicius Silva
  role:
    pt: Analista de Sistemas
    en: Systems Analyst
    es: Analista de Sistemas
  tagline:
    pt: Sustentação e evolução de sistemas corporativos com .NET, C# e Django.
    en: Support and evolution of enterprise systems with .NET, C# and Django.
    es: Soporte y evolución de sistemas corporativos con .NET, C# y Django.
  location:
    pt: Salvador, Bahia, Brasil
    en: Salvador, Bahia, Brazil
    es: Salvador, Bahía, Brasil
  career_start: "2020-02"
  photo: portfolio/img/vinicius.jpg # CONFIRMAR: trocar por foto em resolução maior
  stack: [".NET", "C#", "ASP.NET", "Django", "Python", "JavaScript"]
  about: # CONFIRMAR: rascunho escrito a partir do LinkedIn
    pt:
      - >-
        Sou Analista de Sistemas na Federação das Indústrias do Estado da Bahia
        (FIEB), em Salvador. Trabalho na sustentação e evolução de sistemas
        corporativos em .NET Framework e .NET Core: analiso o problema, corrijo
        e implemento a melhoria em aplicações web usadas no dia a dia do negócio.
      - >-
        Comecei em TI em 2020, como aprendiz na Indra, dentro da Secretaria da
        Fazenda do Estado da Bahia, onde depois atuei com Azure DevOps, pipelines
        de build e release e Sonar. Passei pelo suporte ao Mezzow Connect, pelo
        Tribunal de Contas dos Municípios da Bahia, onde criei a API do menu
        "Decisões" do Portal TCM, e pela Netra Tecnologia, no desenvolvimento do
        SICCO (Sistema de Controle de Contas).
      - >-
        Além do ecossistema .NET, desenvolvo com Python e Django. Este site é
        um exemplo: aplicação Django em container Docker, publicada por esteira
        de CI/CD.
    en:
      - >-
        I am a Systems Analyst at the Federation of Industries of the State of
        Bahia (FIEB), in Salvador, Brazil. I work on the support and evolution
        of enterprise systems in .NET Framework and .NET Core: I analyse the
        problem, fix it and deliver the improvement in web applications the
        business uses every day.
      - >-
        I started in IT in 2020 as an apprentice at Indra, inside the Bahia
        State Department of Finance, where I later worked with Azure DevOps,
        build and release pipelines and Sonar. Since then I have supported the
        Mezzow Connect system, built the API behind the "Decisões" menu of the
        TCM Portal at the Court of Accounts of the Municipalities of Bahia, and
        developed SICCO (the Accounts Control System) at Netra Tecnologia.
      - >-
        Beyond the .NET ecosystem, I develop with Python and Django. This site
        is an example: a Django application in a Docker container, published by
        a CI/CD pipeline.
    es:
      - >-
        Soy Analista de Sistemas en la Federación de Industrias del Estado de
        Bahía (FIEB), en Salvador, Brasil. Trabajo en el soporte y la evolución
        de sistemas corporativos en .NET Framework y .NET Core: analizo el
        problema, lo corrijo e implemento la mejora en aplicaciones web que el
        negocio usa a diario.
      - >-
        Empecé en TI en 2020, como aprendiz en Indra, dentro de la Secretaría
        de Hacienda del Estado de Bahía, donde después trabajé con Azure DevOps,
        pipelines de build y release y Sonar. Pasé por el soporte de Mezzow
        Connect, por el Tribunal de Cuentas de los Municipios de Bahía, donde
        creé la API del menú "Decisões" del Portal TCM, y por Netra Tecnologia,
        en el desarrollo de SICCO (Sistema de Control de Cuentas).
      - >-
        Además del ecosistema .NET, desarrollo con Python y Django. Este sitio
        es un ejemplo: una aplicación Django en un contenedor Docker, publicada
        por un pipeline de CI/CD.
