# Esteira: testa, gera o site e, na main, publica no GitHub Pages.
#
#   pull request -> test, build
#   push na main -> test, build, deploy
#
# O deploy exige que o Pages esteja ligado no repositório com "GitHub Actions"
# como origem (ver docs/github-pages.md).
name: Pipeline

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Endereço do site publicado. Cadastre SITE_URL nas variáveis do repositório
  # para trocar de domínio sem mexer na esteira.
  SITE_URL: ${{ vars.SITE_URL || 'https://viniciussilvadev.com.br' }}

jobs:
  test:
    name: Testes e lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Formatação
        run: uv run ruff format --check .

      - name: Testes
        run: uv run pytest

      - name: Checagem do Django
        run: uv run python manage.py check

  build:
    name: Gerar o site
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --frozen

      - name: Gerar o site
        env:
          DJANGO_STATIC_BUILD: "1"
        run: uv run python manage.py build_static --output dist

      - name: Conferir o que foi gerado
        run: |
          for file in index.html en/index.html es/index.html 404.html \
                      robots.txt sitemap.xml CNAME \
                      static/portfolio/css/base.css; do
            test -s "dist/$file" || { echo "faltou dist/$file"; exit 1; }
          done
          # Vazio de propósito: só a presença importa.
          test -e dist/.nojekyll || { echo "faltou dist/.nojekyll"; exit 1; }
          # Nenhuma página pode sair apontando para a máquina do build.
          ! grep -rq "testserver\|127.0.0.1\|localhost" dist --include='*.html'
          grep -q "${SITE_URL#https://}" dist/CNAME

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write # publicar o site
      id-token: write # provar à API do Pages que o artefato é desta execução
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Conferir que o site publicado responde
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            --output /dev/null "$SITE_URL/"
          echo "Publicado em: $SITE_URL/"
